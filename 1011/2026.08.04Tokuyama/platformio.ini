; PlatformIO Project Configuration File
;
; Build/upload target for ram_stack_send_db_new_1.ino.
; Existing subprojects are intentionally excluded by build_src_filter.

[platformio]
default_envs = ram_stack_send_db_new_1
build_dir = /tmp/pio_ram_stack_send_db_new_1_build

[env:ram_stack_send_db_new_1]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
lib_deps =
    m5stack/M5Unified
